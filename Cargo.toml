[workspace]
resolver = "3"
members = ["crates/media", "crates/library", "crates/server"]

[workspace.package]
edition = "2024"
version = "0.4.0"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

# Password hashing is deliberately slow; unoptimized it takes seconds per
# hash, which makes debug builds and tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
