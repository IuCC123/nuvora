# Nuvora with Docker Compose. Next to this file, create a `.env` with at least
#   NUVORA_MEDIA=/path/to/your/media
# then run `docker compose up -d`. See the README for every setting.
services:
  nuvora:
    image: ${NUVORA_IMAGE:-ghcr.io/iucc123/nuvora:latest}
    container_name: nuvora
    user: "${NUVORA_UID:-10001}:${NUVORA_GID:-10001}"
    ports:
      - "${NUVORA_LISTEN:-0.0.0.0}:${NUVORA_PORT:-8640}:8640"
    # TVs find Nuvora on the network by themselves only with host networking
    # (Linux). To use it, delete the two `ports` lines above and uncomment:
    # network_mode: host
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./data:/data
      - ${NUVORA_MEDIA:?set NUVORA_MEDIA to the folder with your movies and shows}:/media:ro
    environment:
      TZ: ${TZ:-UTC}
      NUVORA_TRUSTED_PROXY: ${NUVORA_TRUSTED_PROXY:-}
      NUVORA_HARDWARE_ENCODING: ${NUVORA_HARDWARE_ENCODING:-auto}
      NUVORA_UPDATES: ${NUVORA_UPDATES:-true}
    # Convert video on the graphics chip (Linux). Intel or AMD: uncomment the
    # next two lines, and set NUVORA_RENDER_GID in .env to the output of
    # `getent group render | cut -d: -f3`.
    # devices: ["/dev/dri:/dev/dri"]
    # group_add: ["${NUVORA_RENDER_GID}"]
    # NVIDIA, with the NVIDIA Container Toolkit installed: uncomment these.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu, video] }]
    restart: unless-stopped
