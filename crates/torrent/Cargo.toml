[package]
name = "nuvora-torrent"
description = "Getting video over BitTorrent: indexer search, downloads into the library, and streams that play while they download."
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nuvora-library = { path = "../library" }
nuvora-media = { path = "../media" }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
librqbit-core = { version = "9", default-features = false }
password-hash = { version = "0.5", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"

[features]
# A torrent session on loopback only, for other crates' tests.
test-support = []
