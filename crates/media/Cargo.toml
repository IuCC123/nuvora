[package]
name = "nuvora-media"
description = "Stateless knowledge about media files: names, ffprobe, artwork rendering, playability."
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "fs", "rt"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = "5"
webp = "0.3"
thumbhash = "0.1"
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
