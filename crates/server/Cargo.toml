[package]
name = "nuvora-server"
description = "The nuvora binary: config, HTTP API, OpenAPI document, embedded web app."
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "nuvora"
path = "src/main.rs"

[dependencies]
nuvora-library = { path = "../library" }
nuvora-media = { path = "../media" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "process", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
mime = "0.3"
utoipa = "5"
utoipa-axum = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
rust-embed = { version = "8", features = ["mime-guess"] }
blake3 = "1"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
sha2 = "0.10"
directories = "6"
mdns-sd = { version = "0.21", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = "3"
