name: Release

# Every push to main publishes ghcr.io/iucc123/nuvora:edge. A version tag
# (v0.2.0) publishes :0.2.0, :0.2 and :latest, and makes a GitHub release
# with the TV app attached as nuvora-tv.apk (the server's /tv points there),
# the Mac and Windows apps, and the server binaries that servers update
# themselves from. The release's asset names never change, so
# releases/latest/download/<name> always means the newest.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/iucc123/nuvora

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      # Each architecture builds natively and is pushed by digest; `publish` joins them under the tags.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

  tv:
    name: TV app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/firetv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # Every release is signed with the same key, so a newer APK installs over an older one.
      - name: Build the signed APK
        env:
          TAG: ${{ github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.NUVORA_KEYSTORE_BASE64 }}
          NUVORA_KEYSTORE_PASSWORD: ${{ secrets.NUVORA_KEYSTORE_PASSWORD }}
          NUVORA_KEY_ALIAS: ${{ secrets.NUVORA_KEY_ALIAS }}
          NUVORA_KEY_PASSWORD: ${{ secrets.NUVORA_KEY_PASSWORD }}
        run: |
          version="${TAG#v}"
          IFS=. read -r major minor patch <<< "${version%%-*}"
          code=$(( major * 10000 + minor * 100 + patch ))
          export NUVORA_KEYSTORE="$RUNNER_TEMP/release.jks"
          base64 -d <<< "$KEYSTORE_BASE64" > "$NUVORA_KEYSTORE"
          ./gradlew --no-daemon :app:assembleRelease -Pnuvora.versionName="$version" -Pnuvora.versionCode="$code"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/nuvora-tv.apk"
          rm "$NUVORA_KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: ${{ runner.temp }}/nuvora-tv.apk
          if-no-files-found: error

  server:
    name: Server for ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          # 22.04's older glibc, so the binary runs on more Linux systems (and in the Docker image).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: |
          cargo build --release --locked -p nuvora-server --target ${{ matrix.target }}
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir -p out
          cp "target/${{ matrix.target }}/release/nuvora$ext" "out/nuvora-server-${{ matrix.target }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }} app
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            runner: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
            build: --target universal-apple-darwin --bundles app,dmg
          - name: Windows
            runner: windows-2025
            targets: x86_64-pc-windows-msvc
            build: --bundles nsis
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: rustup toolchain install && rustup target add ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # Updates are signed with this key (public half in tauri.conf.json); the apps refuse anything else.
      - name: Build
        working-directory: apps/desktop
        env:
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "{\"version\": \"${TAG#v}\"}" > release.conf.json
          bunx tauri build --config release.conf.json ${{ matrix.build }}
          mkdir -p out
          if [[ "${{ matrix.name }}" == Mac ]]; then
            bundle=src-tauri/target/universal-apple-darwin/release/bundle
            cp "$bundle"/dmg/*.dmg out/Nuvora-mac.dmg
            cp "$bundle"/macos/Nuvora.app.tar.gz out/Nuvora-mac.app.tar.gz
            cp "$bundle"/macos/Nuvora.app.tar.gz.sig out/Nuvora-mac.app.tar.gz.sig
          else
            bundle=src-tauri/target/release/bundle
            cp "$bundle"/nsis/*-setup.exe out/Nuvora-windows-setup.exe
            cp "$bundle"/nsis/*-setup.exe.sig out/Nuvora-windows-setup.exe.sig
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: apps/desktop/out/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [publish, tv, server, desktop]
    # A server binary that failed to build only means that platform updates by hand.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success' && needs.tv.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Not the image digests the Docker jobs also upload.
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: "{tv-apk,server-*,desktop-*}"
          merge-multiple: true
      # What servers check a download against before installing it (see crates/server/src/update.rs).
      - working-directory: assets
        run: sha256sum nuvora-server-* > SHA256SUMS
      # What the Mac and Windows apps read to update themselves (Tauri's updater format).
      - working-directory: assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          jq -n \
            --arg version "${TAG#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_sig "$(cat Nuvora-mac.app.tar.gz.sig)" \
            --arg mac_url "$base/Nuvora-mac.app.tar.gz" \
            --arg win_sig "$(cat Nuvora-windows-setup.exe.sig)" \
            --arg win_url "$base/Nuvora-windows-setup.exe" \
            '{version: $version, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
              "darwin-x86_64": {signature: $mac_sig, url: $mac_url},
              "windows-x86_64": {signature: $win_sig, url: $win_url}
            }}' > latest.json
          rm *.sig
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cat > notes.md <<NOTES
          **Install or update:** follow the [setup guide](https://github.com/${GITHUB_REPOSITORY}#set-up-your-server), or run the installer again.

          Docker image: \`${IMAGE}:${version}\` (also \`:latest\`), for x86-64 and ARM64.

          **TV app** (Fire TV and Android TV): \`nuvora-tv.apk\` below. On the TV, open Downloader and enter \`http://<your server>:8640/tv\`. See [the TV guide](https://github.com/${GITHUB_REPOSITORY}#watch-on-your-tv).

          **Mac and Windows apps:** \`Nuvora-mac.dmg\` and \`Nuvora-windows-setup.exe\` below. They update themselves.

          **Servers** update from Settings › General; the \`nuvora-server-*\` files below are what they download.
          NOTES
          gh release create "$TAG" assets/* --title "Nuvora $version" --notes-file notes.md --generate-notes
