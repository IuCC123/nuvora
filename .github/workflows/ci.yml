name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  server:
    name: Server
    runs-on: ubuntu-24.04
    # The same Debian and FFmpeg as the Docker image, so the tests exercise what ships.
    container: rust:trixie
    steps:
      - uses: actions/checkout@v5
      - name: Install FFmpeg
        run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - name: Install the toolchain in rust-toolchain.toml
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      # The server embeds the web app; tests run fine without it built.
      - run: mkdir -p apps/web/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Some tests check files Nuvora can't read, and root can read anything,
      # so the tests run as an ordinary user. Shared runners also get a looser
      # speed budget than a desktop.
      - name: Test
        run: |
          useradd --create-home tester
          chown -R tester "$GITHUB_WORKSPACE" "$CARGO_HOME"
          runuser -u tester -- env PATH="$PATH" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            NUVORA_PERF_BUDGET_MS=250 cargo test --workspace --locked
